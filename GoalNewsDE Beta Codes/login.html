<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: #f5f8fc;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at 18% 12%, #1b4536 0, transparent 36%), radial-gradient(ellipse at 90% 85%, #18334d 0, transparent 35%), #08111d;
    }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .22; background-image: linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px); background-size: 42px 42px; mask-image: linear-gradient(to bottom, black, transparent 82%); }
    .container {
      position: relative;
      width: min(100%, 430px);
      padding: clamp(28px, 7vw, 44px);
      border: 1px solid #ffffff1c;
      border-radius: 24px;
      background: linear-gradient(145deg, #142132f5, #0e1927f5);
      text-align: center;
      box-shadow: 0 28px 90px #0008, inset 0 1px #ffffff12;
      backdrop-filter: blur(14px);
    }
    .container::before { content: "GOALNEWS  /  MITGLIEDERBEREICH"; display: block; margin-bottom: 18px; color: #b9e875; font-size: .68rem; font-weight: 800; letter-spacing: .18em; }
    h2 { margin: 0 0 26px; font-size: clamp(2rem, 8vw, 2.55rem); letter-spacing: -.055em; }
    input {
      display: block;
      width: 100%;
      min-height: 52px;
      margin: 12px 0;
      padding: 0 16px;
      border: 1px solid #ffffff20;
      border-radius: 12px;
      outline: none;
      background: #091321;
      color: #f5f8fc;
      font: inherit;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    input::placeholder { color: #8391a2; }
    input:focus { border-color: #b9e875; background: #0b1725; box-shadow: 0 0 0 4px #b9e8751c; }
    button {
      width: 100%;
      min-height: 52px;
      margin-top: 16px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(110deg, #b9e875, #8fcf54);
      color: #102013;
      font: inherit;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 24px #8fcf5430;
      transition: transform .18s, filter .18s, box-shadow .18s;
    }
    button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.06); box-shadow: 0 12px 30px #8fcf5440; }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { background: #485564; color: #c5ced7; cursor: not-allowed; box-shadow: none; }
    .error { min-height: 20px; margin-top: 14px; color: #ff9e9e; font-size: .88rem; line-height: 1.5; }
    .auth-switch { margin: 20px 0 0; color: #aeb9c8; font-size: .9rem; line-height: 1.6; }
    .auth-switch a, .home-link { color: #c5ee8a; font-weight: 750; text-decoration: none; }
    .auth-switch a:hover, .home-link:hover { color: #e4ffb5; text-decoration: underline; }
    .home-link { display: inline-block; margin-top: 18px; font-size: .86rem; }
    @media (max-width: 480px) { body { padding: 16px; } .container { border-radius: 20px; } }
  </style>
</head>

<body>
  <div class="container">
    <h2>Login</h2>

    <input id="email" type="email" placeholder="E-Mail" />
    <input id="password" type="password" placeholder="Passwort" />

    <button id="loginBtn">Login</button>
    <div id="errorMsg" class="error"></div>
    <p class="auth-switch">Sie haben noch kein Konto? <a href="register.html">Registrieren Sie sich jetzt</a></p>
    <a class="home-link" href="index.html">← Zur Startseite</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
    import { getFirestore, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    // 🔐 Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyBmIcdFtxv4jBJKdiAkEiwnkQ8yRwiG_0w",
      authDomain: "goalnewsde-community.firebaseapp.com",
      projectId: "goalnewsde-community",
      storageBucket: "goalnewsde-community.firebasestorage.app",
      messagingSenderId: "134523022055",
      appId: "1:134523022055:web:4f35ed7812d06e4fb55042",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginBtn = document.getElementById("loginBtn");
    const errorMsg = document.getElementById("errorMsg");

    // 🧠 NEUE LOGIK
    let failedAttempts = 0;
    let lockedUntil = 0;

    loginBtn.addEventListener("click", async () => {
      const now = Date.now();

      // ⛔ Login gesperrt?
      if (now < lockedUntil) {
        const wait = Math.ceil((lockedUntil - now) / 1000);
        errorMsg.textContent = `Zu viele Versuche. Bitte warte ${wait} Sekunden.`;
        return;
      }

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      errorMsg.textContent = "";

      if (!email || !password) {
        errorMsg.textContent = "Bitte E-Mail und Passwort eingeben.";
        return;
      }

      loginBtn.disabled = true;

      try {
        const userCredential = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        // ✅ ERFOLG → Reset
        failedAttempts = 0;
        lockedUntil = 0;

        const user = userCredential.user;

        // 🕒 letzten Login speichern
        const userRef = doc(db, "users", user.uid);
        await updateDoc(userRef, {
          last_login: serverTimestamp(),
        });

        window.location.href = "special.html";

      } catch (err) {
        console.error(err);
        failedAttempts++;

        if (failedAttempts >= 5) {
          lockedUntil = Date.now() + 5000; // ⏱️ 5 Sekunden Sperre
          errorMsg.textContent =
            "Zu viele Login‑Versuche erkannt.Dein Zugriff wurde vorübergehend eingeschränkt.Wiederholte Verstöße können zu einer längeren oder dauerhaften Sperre führen.";
        } else {
          errorMsg.textContent =
            `Login fehlgeschlagen (${failedAttempts}/5).`;
        }
      }

      // Button kurz deaktiviert lassen (UX)
      setTimeout(() => {
        loginBtn.disabled = false;
      }, 800);
    });

    // ⏎ Enter-Taste
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") loginBtn.click();
    });
  </script>
  <script src="beta-banner.js"></script>
</body>
</html>
