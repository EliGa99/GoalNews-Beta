<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Random User Picker — GoalNews (Admin)</title>
<style>
  body{font-family:Inter,system-ui,Arial,sans-serif;background:#0f1113;color:#e8eef0;margin:0;padding:24px;display:flex;align-items:center;justify-content:center;height:100vh}
  .card{background:#0f1720;padding:24px;border-radius:12px;box-shadow:0 8px 30px rgba(2,6,23,0.6);max-width:720px;width:100%}
  h1{margin:0 0 8px 0;color:#1db954}
  .meta{color:#9aa6a8;font-size:14px;margin-bottom:18px}
  .user-box{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:18px;border-radius:10px;border:1px solid rgba(255,255,255,0.03)}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
  .label{color:#9aa6a8;width:120px}
  .value{font-weight:600}
  button{margin-top:16px;padding:10px 14px;border-radius:8px;border:none;background:#1db954;color:#001;font-weight:700;cursor:pointer}
  button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.04);color:#9aa6a8}
  .notice{margin-top:12px;color:#c7d1d2;font-size:14px}
  .error{color:#ff7b7b}
</style>
</head>
<body>
  <div class="card">
    <h1>Random User Picker</h1>
    <div class="meta">Zeigt zufällig genau einen User aus der Collection <code>users</code>. Nur für Admins.</div>

    <div id="content">
      <div id="loading">Lade Nutzer…</div>

      <div id="userDisplay" style="display:none" class="user-box" aria-live="polite">
        <div class="row">
          <div class="label">UID</div><div id="uid" class="value"></div>
        </div>
        <div class="row">
          <div class="label">Username</div><div id="username" class="value"></div>
        </div>
        <div class="row">
          <div class="label">Coins</div><div id="coins" class="value"></div>
        </div>
        <div class="row">
          <div class="label">Favorit</div><div id="fav" class="value"></div>
        </div>
        <div class="row">
          <div class="label">Letzte Aktionen</div><div id="extra" class="value"></div>
        </div>
      </div>

      <div id="noAccess" style="display:none" class="notice error"></div>
      <div id="noUsers" style="display:none" class="notice">Keine Nutzer gefunden.</div>

      <div style="margin-top:14px">
        <button id="pickBtn" style="display:none">Neuen zufälligen User auswählen</button>
        <button id="refreshBtn" class="ghost" style="display:none">Neu laden</button>
      </div>

      <div id="log" class="notice" style="display:none"></div>
    </div>
  </div>

<script type="module">
/*
  Random User Picker (Admin)
  - Lädt alle Dokumente aus collection "users" (einmal)
  - Wählt zufällig ein Dokument aus und zeigt nur diesen User an
  - Admin-Zugriff prüfen: EDITIEREN SIE ADMIN_UIDS vor Einsatz
  - Keine E-Mail/Passwörter ausgeben (sensible Daten vermeiden)
*/

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

// --- Firebase config (wie bei deinen anderen Seiten) ---
const firebaseConfig = {
  apiKey: "AIzaSyBmIcdFtxv4jBJKdiAkEiwnkQ8yRwiG_0w",
  authDomain: "goalnewsde-community.firebaseapp.com",
  projectId: "goalnewsde-community",
  storageBucket: "goalnewsde-community.firebasestorage.app",
  messagingSenderId: "134523022055",
  appId: "1:134523022055:web:4f35ed7812d06e4fb55042"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


const ADMIN_UIDS = ["gaPuzG1ULdUSskKUsciL1g79nh72", "5Oe5YOBOtfOGQsRJ3XUjr3kemnX2"];

// UI-Elemente
const loading = document.getElementById("loading");
const userDisplay = document.getElementById("userDisplay");
const noAccess = document.getElementById("noAccess");
const noUsers = document.getElementById("noUsers");
const pickBtn = document.getElementById("pickBtn");
const refreshBtn = document.getElementById("refreshBtn");
const logEl = document.getElementById("log");

const uidEl = document.getElementById("uid");
const usernameEl = document.getElementById("username");
const coinsEl = document.getElementById("coins");
const favEl = document.getElementById("fav");
const extraEl = document.getElementById("extra");

let usersCache = []; // Array of { id, data }
let currentDisplayed = null;

function showError(msg){
  loading.style.display = "none";
  noAccess.style.display = "block";
  noAccess.textContent = msg;
}

// Prüfen ob eingeloggter User Admin ist, sonst Redirect/Fehler
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    showError("Nicht angemeldet. Bitte als Admin einloggen.");
    return;
  }
  if (!ADMIN_UIDS.includes(user.uid)) {
    showError("Zugriff verweigert. Du bist kein Admin.");
    return;
  }

  // Admin hat Zugriff -> lade Nutzer
  await loadAllUsers();
});

// Nutzer aus Firestore laden (einmal)
async function loadAllUsers(){
  loading.style.display = "block";
  noAccess.style.display = "none";
  userDisplay.style.display = "none";
  noUsers.style.display = "none";
  pickBtn.style.display = "none";
  refreshBtn.style.display = "none";
  logEl.style.display = "none";

  try {
    const colRef = collection(db, "users");
    const snapshot = await getDocs(colRef);
    usersCache = [];

    snapshot.forEach(docSnap => {
      usersCache.push({ id: docSnap.id, data: docSnap.data() });
    });

    loading.style.display = "none";

    if (usersCache.length === 0) {
      noUsers.style.display = "block";
      return;
    }

    // Zeige erstes zufälliges Ergebnis und Buttons
    pickRandomAndShow();
    pickBtn.style.display = "inline-block";
    refreshBtn.style.display = "inline-block";
    logEl.style.display = "block";
    logEl.textContent = `Insgesamt ${usersCache.length} Nutzer geladen.`;
  } catch (e) {
    console.error(e);
    showError("Fehler beim Laden der Nutzer. Konsole prüfen.");
  }
}

// Zufälligen User auswählen und anzeigen
function pickRandomAndShow(){
  if (!usersCache || usersCache.length === 0) return;
  const index = Math.floor(Math.random() * usersCache.length);
  const item = usersCache[index];
  currentDisplayed = item;
  renderUser(item);
}

// Rendert nur den ausgewählten Nutzer (keine Liste)
function renderUser(item){
  const d = item.data || {};
  uidEl.textContent = item.id;
  usernameEl.textContent = d.username || "(kein username)";
  coinsEl.textContent = (typeof d.coins !== "undefined") ? d.coins : "0";
  favEl.textContent = d.favTeam || d.fav || "-";
  // extra: hier z. B. letzte Nachricht / lastSpin anzeigen (nicht sensibel)
  let extras = [];
  if (d.lastSpin) extras.push(`lastSpin: ${d.lastSpin}`);
  if (d.messages && Array.isArray(d.messages) && d.messages.length>0) extras.push(`messages: ${d.messages.length}`);
  extraEl.textContent = extras.length ? extras.join(" • ") : "-";

  // UI
  userDisplay.style.display = "block";
}

// Buttons
pickBtn.addEventListener("click", () => {
  pickRandomAndShow();
});
refreshBtn.addEventListener("click", () => {
  loadAllUsers();
});
</script>
  <script src="beta-banner.js"></script>
</body>
</html>
