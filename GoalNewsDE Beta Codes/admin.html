<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoalNews Admin</title>

<style>
  body {
    margin:0; padding:0;
    background:linear-gradient(120deg,#000,#111);
    font-family:"Poppins",sans-serif;
    color:white;
  }

  header {
    background:linear-gradient(90deg,#8b0000,#006400);
    padding:18px;
    text-align:center;
    font-size:2rem;
    font-weight:700;
    box-shadow:0 0 25px gold;
  }

  .tabs {
    display:flex;
    justify-content:center;
    margin-top:20px;
  }

  .tab {
    padding:12px 25px;
    margin:0 6px;
    background:#222;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    transition:0.25s;
    box-shadow:0 0 10px rgba(255,255,255,0.1);
  }

  .tab:hover {
    background:#333;
    transform:translateY(-3px);
  }

  .tab.active {
    background:#006400;
    color:#ffd700;
    box-shadow:0 0 12px gold;
    transform:translateY(-4px);
  }

  .container {
    max-width:1100px;
    margin:30px auto;
    padding:10px;
  }

  .tabContent {
    display:none;
    animation:fade 0.35s ease;
  }
  .tabContent.active {
    display:block;
  }

  @keyframes fade {
    from {opacity:0}
    to {opacity:1}
  }

  .card {
    background:#222;
    padding:18px;
    border-radius:12px;
    margin:12px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:0.25s;
  }
  .card:hover {
    background:#333;
    transform:translateY(-3px);
  }

  button {
    padding:10px 20px;
    border:none;
    border-radius:8px;
    background:linear-gradient(90deg,#8b0000,#006400);
    font-weight:bold;
    color:white;
    cursor:pointer;
    transition:0.25s;
  }
  button:hover {
    background:linear-gradient(90deg,#ffd700,#ffa500);
    color:#111;
    transform:scale(1.05);
  }

  .statCard {
    background:#222;
    padding:25px;
    margin:15px;
    border-radius:12px;
    text-align:center;
    font-size:1.2rem;
    flex:1 1 220px;
    transition:0.25s;
  }
  .statCard:hover {
    background:#333;
    transform:translateY(-4px);
  }

  .statsWrap {
    display:flex;
    flex-wrap:wrap;
  }

</style>
</head>
<body>

<header>⚙️ GoalNews Admin Dashboard</header>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" data-tab="usersTab">👤 Nutzer</div>
  <div class="tab" data-tab="statsTab">📊 Statistiken</div>
  <div class="tab" data-tab="logsTab">📜 Logs</div>
  <div class="tab" data-tab="settingsTab">⚙️ Einstellungen</div>
</div>

<div class="container">

  <!-- Nutzer -->
  <div id="usersTab" class="tabContent active">
    <h2>👤 Nutzerverwaltung</h2>
    <div id="userList">Lade Nutzer...</div>
  </div>

  <!-- Statistiken -->
  <div id="statsTab" class="tabContent">
    <h2>📊 Statistiken</h2>

    <div class="statsWrap">
      <div class="statCard" id="totalUsers">Nutzer gesamt: ...</div>
      <div class="statCard" id="activeUsers">Aktive Nutzer: ...</div>
      <div class="statCard" id="totalCoins">Coins gesamt: ...</div>
      <div class="statCard" id="averageCoins">Durchschnitt Coins: ...</div>
      <div class="statCard" id="maxCoins">Max Coins: ...</div>
    </div>
  </div>

  <!-- Logs -->
  <div id="logsTab" class="tabContent">
    <h2>📜 Logs</h2>
    <div id="logList">Lade Logs...</div>
  </div>

  <!-- Einstellungen -->
  <div id="settingsTab" class="tabContent">
    <h2>⚙️ Einstellungen</h2>

    <button onclick="addAdmin()">➕ Admin hinzufügen</button>
    <br><br>
    <button onclick="toggleMaintenance()">🛠️ Wartungsmodus umschalten</button>

    <p id="maintenanceStatus"></p>
  </div>

</div>

<!-- FIREBASE -->
<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getFirestore, doc, collection, getDocs, updateDoc, deleteDoc, addDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBmIcdFtxv4jBJKdiAkEiwnkQ8yRwiG_0w",
    authDomain: "goalnewsde-community.firebaseapp.com",
    projectId: "goalnewsde-community",
    storageBucket: "goalnewsde-community.firebasestorage.app",
    messagingSenderId: "134523022055",
    appId: "1:134523022055:web:4f35ed7812d06e4fb55042"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  // 🔑 Deine Admin UID
  const adminUIDs = ["gaPuzG1ULdUSskKUsciL1g79nh72", "5Oe5YOBOtfOGQsRJ3XUjr3kemnX2"];

  function logAction(action) {
    addDoc(collection(db,"logs"),{
      action: action,
      time: new Date(),
      admin: auth.currentUser.uid
    });
  }

  // ---- TABS ----
  const tabs = document.querySelectorAll(".tab");
  const contents = document.querySelectorAll(".tabContent");

  tabs.forEach(tab=>{
    tab.onclick = ()=>{
      tabs.forEach(t=>t.classList.remove("active"));
      tab.classList.add("active");

      contents.forEach(c=>c.classList.remove("active"));
      document.getElementById(tab.dataset.tab).classList.add("active");
    };
  });

  // ---- AUTH ----
  onAuthStateChanged(auth, user => {
    if(!user || !adminUIDs.includes(user.uid)){
      alert("Kein Zugriff!");
      location.href="login.html";
      return;
    }

    loadUsers();
    loadStats();
    loadLogs();
    loadSettings();
  });

  // ---- USERS ----
  async function loadUsers(){
    const userList = document.getElementById("userList");
    userList.innerHTML="";

    const snap = await getDocs(collection(db,"users"));
    snap.forEach(docSnap=>{
      const d = docSnap.data();

      const div = document.createElement("div");
      div.className="card";
      const summary = document.createElement("div");
      const identity = document.createElement("b");
      identity.textContent = d.username || "Kein Name";
      summary.append(identity, document.createTextNode(` (${d.email || "keine E-Mail"})`));
      const details = document.createElement("div");
      details.textContent = `\nCoins: ${d.coins || 0} · Coin-Verwaltung pausiert`;
      summary.appendChild(details);

      const actions = document.createElement("div");
      const coinsButton = document.createElement("button");
      coinsButton.textContent = "Coins pausiert";
      coinsButton.disabled = true;
      const editButton = document.createElement("button");
      editButton.textContent = "Bearbeiten";
      editButton.addEventListener("click", () => window.editUser(docSnap.id, d.username || "", d.email || ""));
      const deleteButton = document.createElement("button");
      deleteButton.textContent = "Löschen";
      deleteButton.addEventListener("click", () => window.deleteUser(docSnap.id));
      actions.append(coinsButton, editButton, deleteButton);
      div.append(summary, actions);

      userList.appendChild(div);
    });
  }

  window.changeCoins = async uid =>{
    alert("Die Coin-Verwaltung ist aus Sicherheitsgründen pausiert.");
  };

  window.editUser = async (uid,oldName,oldMail)=>{
    const nName = prompt("Name:", oldName);
    const nMail = prompt("Email:", oldMail);
    if(!nName || !nMail) return;

    await updateDoc(doc(db,"users",uid),{
      username:nName,
      email:nMail
    });
    logAction(`User bearbeitet: ${uid}`);
    loadUsers();
  };

  window.deleteUser = async uid =>{
    if(!confirm("Wirklich löschen?")) return;

    await deleteDoc(doc(db,"users",uid));
    logAction(`User gelöscht: ${uid}`);
    loadUsers();
    loadStats();
  };

  // ---- STATS ----
  async function loadStats(){
    const snap = await getDocs(collection(db,"users"));

    let total=0, active=0, coins=0, maxC=0;

    snap.forEach(docSnap=>{
      const d = docSnap.data();
      total++;
      if(d.coins>0) active++;
      coins += d.coins || 0;
      if(d.coins>maxC) maxC = d.coins;
    });

    document.getElementById("totalUsers").innerText = `Nutzer gesamt: ${total}`;
    document.getElementById("activeUsers").innerText = `Aktive Nutzer: ${active}`;
    document.getElementById("totalCoins").innerText = `Coins gesamt: ${coins}`;
    document.getElementById("averageCoins").innerText = `Durchschnitt: ${(coins/total).toFixed(2)}`;
    document.getElementById("maxCoins").innerText = `Max Coins: ${maxC}`;
  }

  // ---- LOGS ----
  async function loadLogs(){
    const logList = document.getElementById("logList");
    logList.innerHTML="";

    const snap = await getDocs(collection(db,"logs"));
    snap.forEach(l=>{
      const d=l.data();
      const div=document.createElement("div");
      div.className="card";
      const action = document.createElement("b");
      action.textContent = d.action || "Aktion";
      const time = document.createElement("small");
      time.textContent = d.time?.toDate ? d.time.toDate().toLocaleString() : "Zeit unbekannt";
      div.append(action, document.createElement("br"), time);
      logList.appendChild(div);
    });
  }

  // ---- SETTINGS ----
  async function loadSettings(){
    const docRef = doc(db,"settings","main");
    const snap = await getDoc(docRef);
    const data = snap.exists() ? snap.data() : {};

    document.getElementById("maintenanceStatus").innerText =
      data.maintenance ? "🟥 Wartungsmodus: AKTIV" : "🟩 Wartungsmodus: Aus";
  }

  window.toggleMaintenance = async ()=>{
    const docRef = doc(db,"settings","main");
    const snap = await getDoc(docRef);
    const data = snap.exists() ? snap.data() : {};

    const newState = !data.maintenance;

    await setDoc(docRef,{ maintenance:newState },{merge:true});
    logAction("Wartungsmodus geändert");

    loadSettings();
  };

  window.addAdmin = async ()=>{
    const newID = prompt("Neue Admin UID eingeben:");
    if(!newID) return;

    alert("⚠️ Admins müssen im Code eingetragen werden!");
  };

</script>



  <script src="beta-banner.js"></script>
</body>
</html>
